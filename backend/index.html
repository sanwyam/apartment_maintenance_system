<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartment Maintenance System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 { font-size: 2.5em; margin-bottom: 5px; }
        header p { font-size: 0.95em; opacity: 0.9; }

        .nav-tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
            flex-wrap: wrap;
        }

        .nav-tabs button {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
            min-width: 120px;
        }

        .nav-tabs button:hover { background: #e8e8e8; color: #667eea; }

        .nav-tabs button.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .content { padding: 30px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .form-section.editing {
            border-left-color: #ffc107;
            background: #fffbea;
        }

        .form-section h3 { color: #333; margin-bottom: 15px; font-size: 1.2em; }
        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
            font-size: 0.9em;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 0.95em;
            font-family: inherit;
        }

        textarea { resize: vertical; min-height: 80px; }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button.secondary { background: #6c757d; margin-left: 10px; }
        button.secondary:hover { box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4); }
        button.danger { background: #dc3545; }
        button.danger:hover { box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4); }
        button.edit { background: #ffc107; color: #333; }
        button.edit:hover { box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4); }

        .table-section { margin-top: 30px; }
        .table-section h3 { color: #333; margin-bottom: 15px; font-size: 1.2em; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead { background: #f5f5f5; }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
            font-size: 0.9em;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 0.9em;
        }

        tr:hover { background: #f9f9f9; }

        .action-buttons { display: flex; gap: 8px; }
        .action-buttons button { padding: 6px 12px; font-size: 0.85em; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .success.show { display: block; }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏢 Apartment Maintenance System</h1>
            <p>Manage residents, apartments, bills, complaints, payments & notices</p>
        </header>

        <div class="nav-tabs">
            <button class="tab-btn active" data-tab="residents">Residents</button>
            <button class="tab-btn" data-tab="apartments">Apartments</button>
            <button class="tab-btn" data-tab="bills">Bills</button>
            <button class="tab-btn" data-tab="complaints">Complaints</button>
            <button class="tab-btn" data-tab="payments">Payments</button>
            <button class="tab-btn" data-tab="notices">Notices</button>
        </div>

        <div class="content">
            <!-- RESIDENTS TAB -->
            <div id="residents" class="tab-content active">
                <div class="success" id="residentSuccess"></div>
                <div class="error" id="residentError"></div>

                <div class="form-section" id="residentFormSection">
                    <h3 id="residentFormTitle">Add New Resident</h3>
                    <input type="hidden" id="residentId">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Resident Name *</label>
                            <input type="text" id="residentName" placeholder="e.g., Rajesh Kumar">
                        </div>
                        <div class="form-group">
                            <label>Phone Number *</label>
                            <input type="tel" id="residentPhone" placeholder="e.g., 9876543210">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="residentEmail" placeholder="e.g., rajesh@email.com">
                    </div>
                    <button id="residentSubmitBtn" onclick="saveResident()">Add Resident</button>
                    <button class="secondary" onclick="clearResidentForm()">Clear</button>
                </div>

                <div class="table-section">
                    <h3>All Residents</h3>
                    <div id="residentsList"></div>
                </div>
            </div>

            <!-- APARTMENTS TAB -->
            <div id="apartments" class="tab-content">
                <div class="success" id="apartmentSuccess"></div>
                <div class="error" id="apartmentError"></div>

                <div class="form-section" id="apartmentFormSection">
                    <h3 id="apartmentFormTitle">Add New Apartment</h3>
                    <input type="hidden" id="apartmentId">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Flat Number *</label>
                            <input type="text" id="apartmentFlat" placeholder="e.g., A101">
                        </div>
                        <div class="form-group">
                            <label>Floor Number *</label>
                            <input type="number" id="apartmentFloor" placeholder="e.g., 1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Block Number *</label>
                        <input type="text" id="apartmentBlock" placeholder="e.g., A">
                    </div>
                    <button id="apartmentSubmitBtn" onclick="saveApartment()">Add Apartment</button>
                    <button class="secondary" onclick="clearApartmentForm()">Clear</button>
                </div>

                <div class="table-section">
                    <h3>All Apartments</h3>
                    <div id="apartmentsList"></div>
                </div>
            </div>

            <!-- BILLS TAB -->
            <div id="bills" class="tab-content">
                <div class="success" id="billSuccess"></div>
                <div class="error" id="billError"></div>

                <div class="form-section" id="billFormSection">
                    <h3 id="billFormTitle">Add New Maintenance Bill</h3>
                    <input type="hidden" id="billId">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Apartment *</label>
                            <select id="billApartment"></select>
                        </div>
                        <div class="form-group">
                            <label>Bill Month *</label>
                            <input type="text" id="billMonth" placeholder="e.g., October 2024">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Due Date *</label>
                            <input type="date" id="billDueDate">
                        </div>
                        <div class="form-group">
                            <label>Bill Amount *</label>
                            <input type="number" id="billAmount" step="0.01" placeholder="e.g., 5000">
                        </div>
                    </div>
                    <button id="billSubmitBtn" onclick="saveBill()">Add Bill</button>
                    <button class="secondary" onclick="clearBillForm()">Clear</button>
                </div>

                <div class="table-section">
                    <h3>All Bills</h3>
                    <div id="billsList"></div>
                </div>
            </div>

            <!-- COMPLAINTS TAB -->
            <div id="complaints" class="tab-content">
                <div class="success" id="complaintSuccess"></div>
                <div class="error" id="complaintError"></div>

                <div class="form-section" id="complaintFormSection">
                    <h3 id="complaintFormTitle">Add New Complaint</h3>
                    <input type="hidden" id="complaintId">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Resident *</label>
                            <select id="complaintResident"></select>
                        </div>
                        <div class="form-group">
                            <label>Complaint Type *</label>
                            <select id="complaintType">
                                <option value="">Select Type</option>
                                <option value="Plumbing">Plumbing</option>
                                <option value="Electrical">Electrical</option>
                                <option value="Maintenance">Maintenance</option>
                                <option value="Noise">Noise</option>
                                <option value="Pest Control">Pest Control</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Status *</label>
                        <select id="complaintStatus">
                            <option value="Open">Open</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Resolved">Resolved</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description *</label>
                        <textarea id="complaintDescription" placeholder="Describe the complaint"></textarea>
                    </div>
                    <button id="complaintSubmitBtn" onclick="saveComplaint()">Add Complaint</button>
                    <button class="secondary" onclick="clearComplaintForm()">Clear</button>
                </div>

                <div class="table-section">
                    <h3>All Complaints</h3>
                    <div id="complaintsList"></div>
                </div>
            </div>

            <!-- PAYMENTS TAB -->
            <div id="payments" class="tab-content">
                <div class="success" id="paymentSuccess"></div>
                <div class="error" id="paymentError"></div>

                <div class="form-section" id="paymentFormSection">
                    <h3 id="paymentFormTitle">Add New Payment</h3>
                    <input type="hidden" id="paymentId">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Resident *</label>
                            <select id="paymentResident"></select>
                        </div>
                        <div class="form-group">
                            <label>Bill *</label>
                            <select id="paymentBill"></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Payment Date *</label>
                            <input type="date" id="paymentDate">
                        </div>
                        <div class="form-group">
                            <label>Payment Mode *</label>
                            <select id="paymentMode">
                                <option value="">Select Mode</option>
                                <option value="Bank Transfer">Bank Transfer</option>
                                <option value="Online">Online</option>
                                <option value="Cheque">Cheque</option>
                                <option value="Cash">Cash</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Payment Status *</label>
                        <select id="paymentStatus">
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <button id="paymentSubmitBtn" onclick="savePayment()">Add Payment</button>
                    <button class="secondary" onclick="clearPaymentForm()">Clear</button>
                </div>

                <div class="table-section">
                    <h3>All Payments</h3>
                    <div id="paymentsList"></div>
                </div>
            </div>

            <!-- NOTICES TAB -->
            <div id="notices" class="tab-content">
                <div class="success" id="noticeSuccess"></div>
                <div class="error" id="noticeError"></div>

                <div class="form-section" id="noticeFormSection">
                    <h3 id="noticeFormTitle">Add New Notice</h3>
                    <input type="hidden" id="noticeId">
                    <div class="form-group">
                        <label>Resident *</label>
                        <select id="noticeResident"></select>
                    </div>
                    <div class="form-group">
                        <label>Notice Title *</label>
                        <input type="text" id="noticeTitle" placeholder="e.g., Annual Maintenance Meeting">
                    </div>
                    <div class="form-group">
                        <label>Notice Content *</label>
                        <textarea id="noticeData" placeholder="Enter notice details"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Notice Date *</label>
                        <input type="date" id="noticeDate">
                    </div>
                    <button id="noticeSubmitBtn" onclick="saveNotice()">Add Notice</button>
                    <button class="secondary" onclick="clearNoticeForm()">Clear</button>
                </div>

                <div class="table-section">
                    <h3>All Notices</h3>
                    <div id="noticesList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        // ========== TAB SWITCHING ==========
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
                loadTabData(btn.dataset.tab);
            });
        });

        function loadTabData(tab) {
            if (tab === 'residents') loadResidents();
            if (tab === 'apartments') loadApartments();
            if (tab === 'bills') { loadBills(); loadApartmentsForSelect('billApartment'); }
            if (tab === 'complaints') { loadComplaints(); loadResidentsForSelect('complaintResident'); }
            if (tab === 'payments') { loadPayments(); loadResidentsForSelect('paymentResident'); loadBillsForSelect(); }
            if (tab === 'notices') { loadNotices(); loadResidentsForSelect('noticeResident'); }
        }

        // ========== HELPERS ==========
        function showMessage(elementId, message, type = 'success') {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.add('show');
            setTimeout(() => element.classList.remove('show'), 4000);
        }

        // Puts a form into "edit mode" (yellow box, Update button, Cancel button)
        function setEditMode(prefix, isEditing, label) {
            const section = document.getElementById(`${prefix}FormSection`);
            const title = document.getElementById(`${prefix}FormTitle`);
            const btn = document.getElementById(`${prefix}SubmitBtn`);

            if (isEditing) {
                section.classList.add('editing');
                title.textContent = `Edit ${label}`;
                btn.textContent = 'Update';
                if (!document.getElementById(`${prefix}CancelBtn`)) {
                    const cancel = document.createElement('button');
                    cancel.id = `${prefix}CancelBtn`;
                    cancel.className = 'secondary';
                    cancel.textContent = 'Cancel Edit';
                    cancel.onclick = () => cancelEdit(prefix);
                    btn.after(cancel);
                }
            } else {
                section.classList.remove('editing');
                title.textContent = `Add New ${label}`;
                btn.textContent = `Add ${label}`;
                const cancel = document.getElementById(`${prefix}CancelBtn`);
                if (cancel) cancel.remove();
            }
        }

        function cancelEdit(prefix) {
            const clearers = {
                residentForm: clearResidentForm,
                apartmentForm: clearApartmentForm,
                billForm: clearBillForm,
                complaintForm: clearComplaintForm,
                paymentForm: clearPaymentForm,
                noticeForm: clearNoticeForm
            };
            clearers[`${prefix}Form`]();
        }

        // ========== RESIDENTS ==========
        async function saveResident() {
            const id = document.getElementById('residentId').value;
            const name = document.getElementById('residentName').value;
            const number = document.getElementById('residentPhone').value;
            const email = document.getElementById('residentEmail').value;

            if (!name || !number || !email) {
                showMessage('residentError', 'Please fill all fields');
                return;
            }

            const body = JSON.stringify({ resident_name: name, resident_number: number, resident_email: email });
            const url = id ? `${API_URL}/residents/${id}` : `${API_URL}/residents`;
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body });
                if (res.ok) {
                    showMessage('residentSuccess', id ? 'Resident updated!' : 'Resident added!');
                    clearResidentForm();
                    loadResidents();
                }
            } catch (err) {
                showMessage('residentError', 'Error: ' + err.message);
            }
        }

        async function loadResidents() {
            try {
                const res = await fetch(`${API_URL}/residents`);
                const residents = await res.json();
                let html = '<table><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Actions</th></tr></thead><tbody>';

                if (residents.length === 0) {
                    html = '<div class="empty-state">No residents yet</div>';
                } else {
                    residents.forEach(r => {
                        html += `<tr>
                            <td>${r.resident_id}</td>
                            <td>${r.resident_name}</td>
                            <td>${r.resident_number}</td>
                            <td>${r.resident_email}</td>
                            <td class="action-buttons">
                                <button class="edit" onclick='editResident(${JSON.stringify(r)})'>Edit</button>
                                <button class="danger" onclick="deleteResident(${r.resident_id})">Delete</button>
                            </td>
                        </tr>`;
                    });
                    html += '</tbody></table>';
                }
                document.getElementById('residentsList').innerHTML = html;
            } catch (err) {
                console.error(err);
            }
        }

        function editResident(r) {
            document.getElementById('residentId').value = r.resident_id;
            document.getElementById('residentName').value = r.resident_name;
            document.getElementById('residentPhone').value = r.resident_number;
            document.getElementById('residentEmail').value = r.resident_email;
            setEditMode('resident', true, 'Resident');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteResident(id) {
            if (!confirm('Are you sure?')) return;
            try {
                await fetch(`${API_URL}/residents/${id}`, { method: 'DELETE' });
                showMessage('residentSuccess', 'Resident deleted!');
                loadResidents();
            } catch (err) {
                showMessage('residentError', 'Error deleting resident');
            }
        }

        function clearResidentForm() {
            document.getElementById('residentId').value = '';
            document.getElementById('residentName').value = '';
            document.getElementById('residentPhone').value = '';
            document.getElementById('residentEmail').value = '';
            setEditMode('resident', false, 'Resident');
        }

        // ========== APARTMENTS ==========
        async function saveApartment() {
            const id = document.getElementById('apartmentId').value;
            const flat = document.getElementById('apartmentFlat').value;
            const floor = document.getElementById('apartmentFloor').value;
            const block = document.getElementById('apartmentBlock').value;

            if (!flat || !floor || !block) {
                showMessage('apartmentError', 'Please fill all fields');
                return;
            }

            const body = JSON.stringify({ flat_number: flat, floor_number: parseInt(floor), block_number: block });
            const url = id ? `${API_URL}/apartments/${id}` : `${API_URL}/apartments`;
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body });
                if (res.ok) {
                    showMessage('apartmentSuccess', id ? 'Apartment updated!' : 'Apartment added!');
                    clearApartmentForm();
                    loadApartments();
                }
            } catch (err) {
                showMessage('apartmentError', 'Error: ' + err.message);
            }
        }

        async function loadApartments() {
            try {
                const res = await fetch(`${API_URL}/apartments`);
                const apartments = await res.json();
                let html = '<table><thead><tr><th>ID</th><th>Flat #</th><th>Floor</th><th>Block</th><th>Actions</th></tr></thead><tbody>';

                if (apartments.length === 0) {
                    html = '<div class="empty-state">No apartments yet</div>';
                } else {
                    apartments.forEach(a => {
                        html += `<tr>
                            <td>${a.apartment_id}</td>
                            <td>${a.flat_number}</td>
                            <td>${a.floor_number}</td>
                            <td>${a.block_number}</td>
                            <td class="action-buttons">
                                <button class="edit" onclick='editApartment(${JSON.stringify(a)})'>Edit</button>
                                <button class="danger" onclick="deleteApartment(${a.apartment_id})">Delete</button>
                            </td>
                        </tr>`;
                    });
                    html += '</tbody></table>';
                }
                document.getElementById('apartmentsList').innerHTML = html;
            } catch (err) {
                console.error(err);
            }
        }

        function editApartment(a) {
            document.getElementById('apartmentId').value = a.apartment_id;
            document.getElementById('apartmentFlat').value = a.flat_number;
            document.getElementById('apartmentFloor').value = a.floor_number;
            document.getElementById('apartmentBlock').value = a.block_number;
            setEditMode('apartment', true, 'Apartment');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteApartment(id) {
            if (!confirm('Are you sure?')) return;
            try {
                await fetch(`${API_URL}/apartments/${id}`, { method: 'DELETE' });
                showMessage('apartmentSuccess', 'Apartment deleted!');
                loadApartments();
            } catch (err) {
                showMessage('apartmentError', 'Error deleting apartment');
            }
        }

        function clearApartmentForm() {
            document.getElementById('apartmentId').value = '';
            document.getElementById('apartmentFlat').value = '';
            document.getElementById('apartmentFloor').value = '';
            document.getElementById('apartmentBlock').value = '';
            setEditMode('apartment', false, 'Apartment');
        }

        // ========== BILLS ==========
        async function saveBill() {
            const id = document.getElementById('billId').value;
            const apartmentId = document.getElementById('billApartment').value;
            const month = document.getElementById('billMonth').value;
            const dueDate = document.getElementById('billDueDate').value;
            const amount = document.getElementById('billAmount').value;

            if (!apartmentId || !month || !dueDate || !amount) {
                showMessage('billError', 'Please fill all fields');
                return;
            }

            const body = JSON.stringify({
                apartment_id: parseInt(apartmentId),
                bill_month: month,
                due_date: dueDate,
                bill_amount: parseFloat(amount)
            });
            const url = id ? `${API_URL}/bills/${id}` : `${API_URL}/bills`;
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body });
                if (res.ok) {
                    showMessage('billSuccess', id ? 'Bill updated!' : 'Bill added!');
                    clearBillForm();
                    loadBills();
                }
            } catch (err) {
                showMessage('billError', 'Error: ' + err.message);
            }
        }

        async function loadBills() {
            try {
                const res = await fetch(`${API_URL}/bills`);
                const bills = await res.json();
                let html = '<table><thead><tr><th>ID</th><th>Apartment</th><th>Month</th><th>Due Date</th><th>Amount</th><th>Actions</th></tr></thead><tbody>';

                if (bills.length === 0) {
                    html = '<div class="empty-state">No bills yet</div>';
